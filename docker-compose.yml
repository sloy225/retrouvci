services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: retrouvci_user
      POSTGRES_PASSWORD: retrouvci_pass
      POSTGRES_DB: retrouvci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://retrouvci_user:retrouvci_pass@db:5432/retrouvci
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Le service frontend est désactivé pour l'instant : le dossier frontend/
  # ne contient qu'une maquette HTML statique, pas encore un projet Next.js
  # avec son propre Dockerfile. Décommente ce bloc une fois le projet
  # Next.js initialisé (npx create-next-app@latest frontend).
  #
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #   ports:
  #     - "3000:3000"

volumes:
  postgres_data: